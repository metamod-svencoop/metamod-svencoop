name: windows

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'metamod-svencoop/metamod-svencoop'

    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure x86
        if: matrix.arch == 'x86'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake -S . -B build/x86/${{ matrix.config }} -A Win32 -DMMFG_METAMOD_BUILD_TESTS=ON

      - name: Configure x64
        if: matrix.arch == 'x64'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake -S . -B build/x64/${{ matrix.config }} -A x64 -DMMFG_METAMOD_BUILD_TESTS=ON -DMMFG_SYNC_GAMEDATA=OFF

      - name: Build and install
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cmake --build build/${{ matrix.arch }}/${{ matrix.config }} --config ${{ matrix.config }} --parallel 6
          cmake --install build/${{ matrix.arch }}/${{ matrix.config }} --config ${{ matrix.config }}

      - name: Verify component PDBs
        working-directory: ${{env.GITHUB_WORKSPACE}}
        shell: pwsh
        run: |
          $dllSubdir = if ('${{ matrix.arch }}' -eq 'x64') { 'win64' } else { 'win32' }
          $pdbDirectory = Join-Path $env:GITHUB_WORKSPACE "install\${{ matrix.arch }}\${{ matrix.config }}\addons\metamod\dlls\$dllSubdir"
          $expectedPdbs = @(
            'metamod.pdb',
            'asext.pdb',
            'fallguys.pdb',
            'ascurl.pdb',
            'asqcvar.pdb',
            'assqlite.pdb',
            'asusermsg.pdb',
            'slowdl.pdb'
          )
          if ('${{ matrix.arch }}' -eq 'x86') {
            $expectedPdbs += 'gsphysfix.pdb'
          }

          $missingPdbs = @()
          foreach ($pdb in $expectedPdbs) {
            if (-not (Test-Path (Join-Path $pdbDirectory $pdb))) {
              $missingPdbs += $pdb
            }
          }

          if ($missingPdbs.Count -gt 0) {
            throw "Missing component PDBs: $($missingPdbs -join ', ')"
          }

      - name: Test components
        run: |
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/metamod/tests -C ${{ matrix.config }} --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/asext -C ${{ matrix.config }} --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/assqlite -C ${{ matrix.config }} --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/fallguys -C ${{ matrix.config }} --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/slowdl -C ${{ matrix.config }} --output-on-failure

      - name: Test x86-only components
        if: matrix.arch == 'x86'
        run: ctest --test-dir build/x86/${{ matrix.config }}/gsphysfix -C ${{ matrix.config }} --output-on-failure

      - name: Test release scripts
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_release*.py' -v

      - name: Stage release payload
        if: matrix.config == 'Release'
        run: cmake -E copy_directory install/${{ matrix.arch }}/Release/addons "${{ runner.temp }}/mmfg-release/build/addons"

      - name: Archive the install payload
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ github.workspace }}/metamod-fallguys-windows-${{ matrix.arch }}.zip'
          directory: '${{ runner.temp }}/mmfg-release'
          path: 'build'
          exclusions: '*.pdb'
          recursive_exclusions: '*.pdb'

      - name: Archive the install payload with PDBs
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ github.workspace }}/metamod-fallguys-windows-${{ matrix.arch }}-with-pdb.zip'
          directory: '${{ runner.temp }}/mmfg-release'
          path: 'build'

      - name: Upload release artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            metamod-fallguys-windows-${{ matrix.arch }}.zip
            metamod-fallguys-windows-${{ matrix.arch }}-with-pdb.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
