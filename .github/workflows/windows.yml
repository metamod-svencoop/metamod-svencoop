name: windows

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'metamod-svencoop/metamod-svencoop'

    runs-on: windows-2022
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build all
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cmake -S . -B build/x86/${{ matrix.config }} -A Win32 -DMMFG_METAMOD_BUILD_TESTS=ON
          cmake --build build/x86/${{ matrix.config }} --config ${{ matrix.config }} --parallel 6
          cmake --install build/x86/${{ matrix.config }} --config ${{ matrix.config }}

      - name: Verify component PDBs
        working-directory: ${{env.GITHUB_WORKSPACE}}
        shell: pwsh
        run: |
          $pdbDirectory = Join-Path $env:GITHUB_WORKSPACE 'install\x86\${{ matrix.config }}\addons\metamod\dlls'
          $expectedPdbs = @(
            'metamod.pdb',
            'asext.pdb',
            'fallguys.pdb',
            'ascurl.pdb',
            'asqcvar.pdb',
            'asusermsg.pdb',
            'slowdl.pdb',
            'gsphysfix.pdb'
          )

          $missingPdbs = @()
          foreach ($pdb in $expectedPdbs) {
            if (-not (Test-Path (Join-Path $pdbDirectory $pdb))) {
              $missingPdbs += $pdb
            }
          }

          if ($missingPdbs.Count -gt 0) {
            throw "Missing component PDBs: $($missingPdbs -join ', ')"
          }

      - name: Test components
        run: |
          ctest --test-dir build/x86/${{ matrix.config }}/metamod/tests -C ${{ matrix.config }} --output-on-failure
          ctest --test-dir build/x86/${{ matrix.config }}/slowdl -C ${{ matrix.config }} --output-on-failure
          ctest --test-dir build/x86/${{ matrix.config }}/gsphysfix -C ${{ matrix.config }} --output-on-failure

      - name: Test release scripts
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_release*.py' -v

      - name: Stage release payload
        if: matrix.config == 'Release'
        run: cmake -E copy_directory install/x86/Release/addons "${{ runner.temp }}/mmfg-release/build/addons"

      - name: Archive the install payload
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ github.workspace }}/metamod-fallguys-windows-x86.zip'
          directory: '${{ runner.temp }}/mmfg-release'
          path: 'build'
          exclusions: '*.pdb'
          recursive_exclusions: '*.pdb'

      - name: Archive the install payload with PDBs
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ github.workspace }}/metamod-fallguys-windows-x86-with-pdb.zip'
          directory: '${{ runner.temp }}/mmfg-release'
          path: 'build'

      - name: Upload release artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            metamod-fallguys-windows-x86.zip
            metamod-fallguys-windows-x86-with-pdb.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
