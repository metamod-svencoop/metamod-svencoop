name: ubuntu

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'metamod-svencoop/metamod-svencoop'

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential gcc gcc-multilib g++-multilib

      - name: Build all
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cmake -S . -B build/x86/${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DMMFG_METAMOD_BUILD_TESTS=ON
          cmake --build build/x86/${{ matrix.config }} --parallel 6
          cmake --install build/x86/${{ matrix.config }}

      - name: Test components
        run: |
          ctest --test-dir build/x86/${{ matrix.config }}/metamod/tests --output-on-failure
          ctest --test-dir build/x86/${{ matrix.config }}/slowdl --output-on-failure
          ctest --test-dir build/x86/${{ matrix.config }}/gsphysfix --output-on-failure

      - name: Test release scripts
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_release*.py' -v

      - name: Stage release payload
        if: matrix.config == 'Release'
        run: cmake -E copy_directory install/x86/Release/addons "${{ runner.temp }}/mmfg-release/build/addons"

      - name: Archive the install payload
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ github.workspace }}/metamod-fallguys-ubuntu-i386.zip'
          directory: '${{ runner.temp }}/mmfg-release'
          path: 'build'

      - name: Upload release artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu
          path: |
            metamod-fallguys-ubuntu-i386.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
