name: ubuntu

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'metamod-svencoop/metamod-svencoop'

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            package_arch: i386
            config: Debug
          - arch: x86
            package_arch: i386
            config: Release
          - arch: x64
            package_arch: x86_64
            config: Debug
          - arch: x64
            package_arch: x86_64
            config: Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build environment (x86)
        if: matrix.arch == 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential gcc gcc-multilib g++-multilib

      - name: Install build environment (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential gcc g++

      - name: Configure x86
        if: matrix.arch == 'x86'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake -S . -B build/x86/${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DMMFG_METAMOD_BUILD_TESTS=ON

      - name: Configure x64
        if: matrix.arch == 'x64'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake -S . -B build/x64/${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DMETAMOD_64BIT=ON -DMMFG_METAMOD_BUILD_TESTS=ON -DMMFG_SYNC_GAMEDATA=OFF

      - name: Build and install
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cmake --build build/${{ matrix.arch }}/${{ matrix.config }} --parallel 6
          cmake --install build/${{ matrix.arch }}/${{ matrix.config }}

      - name: Test components
        run: |
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/metamod/tests --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/asext --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/assqlite --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/fallguys --output-on-failure
          ctest --test-dir build/${{ matrix.arch }}/${{ matrix.config }}/slowdl --output-on-failure

      - name: Test x86-only components
        if: matrix.arch == 'x86'
        run: ctest --test-dir build/x86/${{ matrix.config }}/gsphysfix --output-on-failure

      - name: Test release scripts
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          python -B -m unittest discover -s scripts/tests -p 'test_release*.py' -v

      - name: Stage release payload
        if: matrix.config == 'Release'
        run: cmake -E copy_directory install/${{ matrix.arch }}/Release/addons "${{ runner.temp }}/mmfg-release/build/addons"

      - name: Archive the install payload
        if: matrix.config == 'Release'
        working-directory: ${{ runner.temp }}/mmfg-release
        run: 7z a -t7z -bd -y "${{ github.workspace }}/metamod-svencoop-ubuntu-${{ matrix.package_arch }}.7z" build

      - name: Upload release artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu-${{ matrix.package_arch }}
          path: |
            metamod-svencoop-ubuntu-${{ matrix.package_arch }}.7z
          if-no-files-found: error
          retention-days: 14
          overwrite: true
